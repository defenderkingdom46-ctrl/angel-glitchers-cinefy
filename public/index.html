<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEFy | Forensic Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-8">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-500 rounded-lg">
                    <i data-lucide="shield-search" class="text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">CINEFy <span class="text-indigo-400">PRO</span></h1>
            </div>

            <nav class="flex-1 space-y-4">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Session Info</div>
                <div id="stats" class="space-y-3">
                    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-700/50">
                        <p class="text-xs text-slate-400">Endpoints Found</p>
                        <p id="count-endpoints" class="text-2xl font-mono font-bold text-indigo-400">0</p>
                    </div>
                </div>
            </nav>

            <div class="mt-auto">
                <button id="download-btn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/20">
                    <i data-lucide="download"></i> Download Report
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Bar -->
            <header class="h-20 border-b border-slate-800 flex items-center px-8 bg-slate-900/20 backdrop-blur-md">
                <div class="flex-1 flex items-center gap-4">
                    <input type="text" id="url-input" placeholder="Enter target URL (https://...)" 
                        class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                    <button id="scan-btn" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2">
                        <span>SCAN</span>
                        <i data-lucide="zap" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- Results Area -->
            <section class="flex-1 overflow-y-auto p-8 space-y-6">
                <!-- Terminal Log -->
                <div class="bg-black/40 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                    <div class="bg-slate-800/50 px-4 py-2 flex items-center gap-2 border-b border-slate-800">
                        <div class="flex gap-1.5">
                            <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/50"></div>
                        </div>
                        <span class="text-xs font-mono text-slate-500 ml-2">live_forensic_log.sh</span>
                    </div>
                    <div id="log-window" class="p-4 h-64 overflow-y-auto font-mono text-sm space-y-1 scrollbar-hide">
                        <div class="text-slate-500 italic">Waiting for target URL...</div>
                    </div>
                </div>

                <!-- Endpoint Grid -->
                <div id="endpoint-list" class="grid grid-cols-1 gap-4">
                    <!-- Cards will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
